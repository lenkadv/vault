<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=1080,initial-scale=1"><link rel="stylesheet" href="tokens.css">
<style>
  .frame{background:var(--paper);font-family:var(--sans);display:flex;align-items:center;justify-content:center;padding:80px;}
  .card{background:#fff;border-radius:36px;width:100%;padding:78px 70px 64px;box-shadow:0 30px 70px rgba(27,35,51,.14);position:relative;}
  .stars{display:flex;gap:10px;font-size:52px;color:var(--accent);line-height:1;}
  .verified{position:absolute;top:78px;right:70px;display:flex;align-items:center;gap:10px;color:#1aa251;font-size:24px;font-weight:700;}
  .verified .tick{width:34px;height:34px;border-radius:50%;background:#1aa251;color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;}
  .quote{margin-top:40px;font-size:46px;line-height:1.34;color:var(--ink);font-weight:500;letter-spacing:-.3px;}
  .quote b{color:var(--ink-deep);font-weight:700;}
  .div{height:1px;background:#ece6da;margin:48px 0 40px;}
  .who{display:flex;align-items:center;gap:26px;}
  .who .ph{width:108px;height:108px;flex:0 0 108px;}
  .who .name{font-size:34px;font-weight:700;color:var(--ink);}
  .who .role{font-size:26px;color:var(--muted);margin-top:4px;}
  .foot{position:absolute;left:70px;right:70px;bottom:-2px;}
  .wmrow{position:absolute;bottom:36px;right:46px;font-family:var(--serif);font-size:34px;color:var(--ink);}
  .wmrow b{color:var(--accent);font-weight:400;}
</style></head>
<body><div class="frame social">
  <div class="card">
    <div class="stars">★★★★★</div>
    <div class="verified"><span class="tick">✓</span>Verified customer</div>
    <div class="quote">If you're on the fence, this is a <b>no-brainer</b>. Been using it for months and it's worth every penny.</div>
    <div class="div"></div>
    <div class="who">
      <div class="ph circimg"><img src="assets/placeholder-avatar.svg" alt="Customer photo"></div>
      <div>
        <div class="name">Customer name</div>
        <div class="role">What they do &middot; Where they're from</div>
      </div>
    </div>
    <div class="wmrow">[Your <b>Brand</b>]</div>
  </div>
</div></body></html>
