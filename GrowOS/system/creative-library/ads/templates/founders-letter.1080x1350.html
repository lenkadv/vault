<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="tokens.css">
<style>
.frame{width:1080px;height:1350px;
  background:#cdbfa6;
  background-image:radial-gradient(120% 90% at 50% 20%, #d9ccb4 0%, #c3b399 70%, #b3a289 100%);
  display:flex;align-items:center;justify-content:center;
  font-family:"Bradley Hand","Noteworthy","Marker Felt","Segoe Print",cursive;}
/* subtle woven backdrop shading */
.frame::before{content:"";position:absolute;inset:0;
  background:radial-gradient(130% 100% at 50% 30%, rgba(255,250,240,.35), rgba(90,70,45,.22) 90%);}
.paper{position:relative;width:820px;height:1010px;background:#F6EEDC;
  border-radius:6px;transform:rotate(-2.3deg);
  box-shadow:0 40px 70px rgba(40,28,10,.42), 0 8px 18px rgba(40,28,10,.28),
    inset 0 0 60px rgba(150,120,70,.10);
  padding:118px 96px 96px;}
/* paper fibre noise */
.paper::before{content:"";position:absolute;inset:0;border-radius:6px;pointer-events:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.05'/></svg>");
  mix-blend-mode:multiply;opacity:.6;}
/* torn/soft edge vignette on paper */
.paper::after{content:"";position:absolute;inset:0;border-radius:6px;pointer-events:none;
  box-shadow:inset 0 0 40px rgba(120,95,55,.18);}
/* coffee ring */
.ring{position:absolute;width:210px;height:210px;right:64px;top:44px;border-radius:50%;
  background:radial-gradient(circle, rgba(120,80,35,0) 60%, rgba(120,80,35,.22) 66%, rgba(105,68,28,.30) 73%, rgba(120,80,35,0) 79%);
  transform:rotate(12deg);pointer-events:none;}
.ring::after{content:"";position:absolute;inset:22px;border-radius:50%;
  background:radial-gradient(circle, rgba(120,80,35,.05), rgba(120,80,35,0) 70%);}
.note{position:relative;color:#243b3a;font-size:58px;line-height:1.42;letter-spacing:.3px;}
.note .b{color:#b64a10;}
.sig{position:relative;margin-top:52px;text-align:right;font-size:70px;color:#1f3130;
  transform:rotate(-1deg);padding-right:26px;}
</style>
</head>
<body>
<div class="frame">
  <div class="paper">
    <div class="ring"></div>
    <div class="note">I built this because I was tired of doing my own marketing by hand.<br><br>It costs <span class="b">[$price]</span>. I'm not sorry it's that affordable.</div>
    <div class="sig">&ndash; [Your name]</div>
  </div>
</div>
</body>
</html>
