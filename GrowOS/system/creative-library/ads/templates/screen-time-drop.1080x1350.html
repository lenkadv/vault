<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=1080,initial-scale=1">
<link rel="stylesheet" href="tokens.css">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1350px;overflow:hidden}
  body{font-family:-apple-system,"SF Pro Text","SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;background:#F2F2F7;color:#000}
  .frame{width:1080px;height:1350px;overflow:hidden;position:relative;display:flex;flex-direction:column}

  /* ---- status bar ---- */
  .status{flex:0 0 84px;display:flex;align-items:center;justify-content:space-between;padding:0 52px;font-size:34px;font-weight:600;letter-spacing:.3px;color:#000}
  .status .right{display:flex;align-items:center;gap:14px}
  .status .right svg{display:block}

  /* ---- nav ---- */
  .nav{padding:8px 40px 0;display:flex;align-items:center;gap:10px;color:#007AFF;font-size:38px}
  .nav svg{display:block}
  .bigtitle{padding:26px 44px 30px;font-size:96px;font-weight:700;letter-spacing:-1.5px;color:#000}

  /* ---- summary card ---- */
  .card{background:#fff;border-radius:28px;margin:0 44px;padding:44px 48px 40px}
  .cat{font-size:30px;font-weight:600;color:#8A8A8E;letter-spacing:1.2px;text-transform:uppercase}
  .lastweek{margin-top:22px;font-size:40px;color:#8E8E93;text-decoration:line-through;text-decoration-color:rgba(60,60,67,.5);text-decoration-thickness:3px;font-feature-settings:"tnum"}
  .thisweek{margin-top:10px;font-size:66px;font-weight:600;letter-spacing:-1px;color:#000;font-feature-settings:"tnum"}
  .thisweek .delta{font-size:44px;font-weight:600;color:#34C759;margin-left:16px;letter-spacing:0}

  /* ---- chart ---- */
  .chart{position:relative;height:430px;margin-top:56px}
  .gridline{position:absolute;left:0;right:0;height:1.5px;background:#E5E5EA}
  .gridline .lbl{position:absolute;right:0;top:-38px;font-size:28px;color:#C7C7CC;font-feature-settings:"tnum"}
  .cols{position:absolute;left:0;right:0;top:0;bottom:0;display:flex}
  .col{flex:1;position:relative;display:flex;align-items:flex-end;justify-content:center}
  .bar{width:58px;background:#0A84FF;border-radius:12px 12px 4px 4px}
  .col.marked .vline{position:absolute;left:50%;top:-14px;bottom:-58px;width:2px;background:rgba(60,60,67,.28);transform:translateX(-1px)}
  .col.marked .dot{position:absolute;left:50%;transform:translate(-50%,0);width:22px;height:22px;border-radius:50%;background:#0A84FF;border:5px solid #fff;box-shadow:0 0 0 1.5px rgba(60,60,67,.25)}
  .days{display:flex;margin-top:22px}
  .days span{flex:1;text-align:center;font-size:30px;color:#8E8E93;font-weight:500}

  /* ---- app row ---- */
  .rowcard{background:#fff;border-radius:28px;margin:40px 44px 0;padding:34px 44px;display:flex;align-items:center;gap:34px}
  .appicon{flex:0 0 104px;width:104px;height:104px;border-radius:24px;background:linear-gradient(165deg,#F7F7FA,#E8E8ED);display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 1.5px rgba(60,60,67,.08)}
  .rowtext{flex:1;min-width:0}
  .rowtitle{font-size:42px;font-weight:590;color:#000;letter-spacing:-.3px}
  .rowsub{font-size:33px;color:#8E8E93;margin-top:6px}
  .chev{flex:0 0 auto}
</style></head>
<body><div class="frame">

  <!-- status bar -->
  <div class="status">
    <span>9:41</span>
    <span class="right">
      <svg width="40" height="26" viewBox="0 0 40 26" fill="#000"><rect x="0" y="16" width="6" height="9" rx="1.5"/><rect x="9" y="11" width="6" height="14" rx="1.5"/><rect x="18" y="6" width="6" height="19" rx="1.5"/><rect x="27" y="1" width="6" height="24" rx="1.5"/></svg>
      <svg width="36" height="26" viewBox="0 0 36 26" fill="#000"><path d="M18 5c5.5 0 10.6 2.1 14.4 5.6l-3 3.2C26.5 11.1 22.4 9.4 18 9.4S9.5 11.1 6.6 13.8l-3-3.2C7.4 7.1 12.5 5 18 5z"/><path d="M18 13.4c3 0 5.8 1.1 8 3l-3 3.2c-1.4-1.3-3.2-2-5-2s-3.6.7-5 2l-3-3.2c2.2-1.9 5-3 8-3z"/><circle cx="18" cy="23" r="3.2"/></svg>
      <svg width="54" height="26" viewBox="0 0 54 26" fill="none"><rect x="1" y="2" width="44" height="22" rx="6" stroke="#000" stroke-opacity=".35" stroke-width="2"/><rect x="4" y="5" width="38" height="16" rx="3.5" fill="#000"/><rect x="48" y="9" width="4" height="8" rx="2" fill="#000" fill-opacity=".35"/></svg>
    </span>
  </div>

  <!-- nav back -->
  <div class="nav">
    <svg width="26" height="44" viewBox="0 0 13 22" fill="none" stroke="#007AFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M11 1L2 11l9 10"/></svg>
    <span>Settings</span>
  </div>

  <div class="bigtitle">Screen Time</div>

  <!-- summary + chart card -->
  <div class="card">
    <div class="cat">Marketing apps</div>
    <div class="lastweek">Last Week: 11h 23m</div>
    <div class="thisweek">This Week: 41m<span class="delta">&#8595;94%</span></div>

    <div class="chart">
      <div class="gridline" style="top:0"><span class="lbl">4h</span></div>
      <div class="gridline" style="top:50%"><span class="lbl">2h</span></div>
      <div class="gridline" style="bottom:0"></div>
      <div class="cols">
        <div class="col"><div class="bar" style="height:352px"></div></div>
        <div class="col"><div class="bar" style="height:398px"></div></div>
        <div class="col"><div class="bar" style="height:371px"></div></div>
        <div class="col marked">
          <div class="vline"></div>
          <div class="bar" style="height:88px"></div>
          <div class="dot" style="bottom:77px"></div>
        </div>
        <div class="col"><div class="bar" style="height:16px"></div></div>
        <div class="col"><div class="bar" style="height:10px"></div></div>
        <div class="col"><div class="bar" style="height:13px"></div></div>
      </div>
    </div>
    <div class="days"><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span></div>
  </div>

  <!-- app row -->
  <div class="rowcard">
    <div class="appicon">
      <svg width="52" height="62" viewBox="0 0 26 31" fill="none"><path d="M3 1h13l7 7v20a2 2 0 01-2 2H3a2 2 0 01-2-2V3a2 2 0 012-2z" fill="#fff" stroke="#B9B9C0" stroke-width="1.6"/><path d="M16 1v7h7" fill="#EDEDF2" stroke="#B9B9C0" stroke-width="1.6" stroke-linejoin="round"/><rect x="5.5" y="13" width="15" height="1.8" rx=".9" fill="#C7C7CC"/><rect x="5.5" y="17.5" width="15" height="1.8" rx=".9" fill="#C7C7CC"/><rect x="5.5" y="22" width="10" height="1.8" rx=".9" fill="#C7C7CC"/></svg>
    </div>
    <div class="rowtext">
      <div class="rowtitle">Newsletter draft&#8230;</div>
      <div class="rowsub">Opened automatically</div>
    </div>
    <span class="chev">
      <svg width="20" height="36" viewBox="0 0 10 18" fill="none" stroke="#C7C7CC" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 1.5L8.5 9l-7 7.5"/></svg>
    </span>
  </div>

</div></body></html>
