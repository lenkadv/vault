<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=1080,initial-scale=1">
<link rel="stylesheet" href="tokens.css">
<style>
  html,body{overflow:hidden;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}
  .frame{width:1080px;height:1350px;
    font-family:-apple-system,"SF Pro Text","SF Pro Display","Helvetica Neue",sans-serif;
    background:
      radial-gradient(140% 100% at 20% 12%, var(--paper-2) 0%, rgba(234,231,222,0) 55%),
      radial-gradient(150% 120% at 88% 96%, var(--ink-deep) 0%, rgba(27,35,51,0) 58%),
      linear-gradient(158deg,var(--accent-soft) 0%, var(--accent) 38%, var(--ink-deep) 100%);
  }
  /* frosted blur veil over the wallpaper so it reads as an out-of-focus desktop */
  .veil{position:absolute;inset:-40px;backdrop-filter:blur(46px);-webkit-backdrop-filter:blur(46px);
    background:rgba(20,20,25,.14);}
  .stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;}

  .alert{width:678px;border-radius:26px;padding:52px 54px 30px;text-align:center;
    background:rgba(243,242,244,.86);
    backdrop-filter:blur(60px) saturate(180%);-webkit-backdrop-filter:blur(60px) saturate(180%);
    border:1px solid rgba(255,255,255,.5);
    box-shadow:0 2px 0 rgba(255,255,255,.35) inset, 0 44px 120px rgba(0,0,0,.45), 0 8px 26px rgba(0,0,0,.28);}

  .icon{width:150px;height:150px;margin:0 auto 30px;filter:drop-shadow(0 10px 18px rgba(0,0,0,.22));}
  .title{font-size:41px;font-weight:700;letter-spacing:-.4px;color:#1c1c1e;line-height:1.24;padding:0 6px;}
  .msg{font-size:29px;font-weight:400;color:#4a4a4d;line-height:1.4;margin-top:18px;padding:0 14px;}

  .btns{display:flex;gap:20px;margin-top:44px;}
  .btn{flex:1;height:82px;border-radius:16px;font-size:31px;font-weight:600;letter-spacing:.1px;
    display:flex;align-items:center;justify-content:center;}
  .keep{background:rgba(255,255,255,.92);color:#1c1c1e;border:1px solid rgba(0,0,0,.14);
    box-shadow:0 1px 2px rgba(0,0,0,.08);}
  .delete{background:linear-gradient(#1a8cff,#0a78f0);color:#fff;position:relative;
    box-shadow:0 4px 12px rgba(10,120,240,.42), 0 1px 0 rgba(255,255,255,.35) inset;}

  /* macOS pointer hovering Delete */
  .cursor{position:absolute;right:150px;bottom:118px;width:52px;height:52px;
    filter:drop-shadow(0 3px 4px rgba(0,0,0,.4));}
</style></head>
<body><div class="frame">
  <div class="veil"></div>
  <div class="stage">
    <div class="alert">
      <svg class="icon" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="16" y="16" width="88" height="88" rx="22" fill="url(#g)"/>
        <defs><linearGradient id="g" x1="60" y1="16" x2="60" y2="104" gradientUnits="userSpaceOnUse">
          <stop stop-color="#8f96a3"/><stop offset="1" stop-color="#5b616d"/></linearGradient></defs>
        <g stroke="#fff" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M38 44h44"/>
          <path d="M54 44v-6a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v6"/>
          <path d="M43 44l3 40a5 5 0 0 0 5 5h18a5 5 0 0 0 5-5l3-40" fill="rgba(255,255,255,.12)"/>
          <path d="M53 54v26M60 54v26M67 54v26"/>
        </g>
      </svg>
      <div class="title">Move &ldquo;Marketing stress&rdquo; to Trash?</div>
      <div class="msg">This item will be deleted immediately.<br>You can&rsquo;t undo this action.</div>
      <div class="btns">
        <div class="btn keep">Keep</div>
        <div class="btn delete">Delete</div>
      </div>
      <svg class="cursor" viewBox="0 0 24 24" fill="#fff" stroke="#000" stroke-width="1.4" stroke-linejoin="round">
        <path d="M5 3l0 16 4-4 3 6 3-1.4-3-6 6 0z"/>
      </svg>
    </div>
  </div>
</div></body></html>
