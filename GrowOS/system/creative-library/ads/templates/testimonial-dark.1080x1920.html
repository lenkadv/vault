<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="tokens.css">
<style>
html,body{overflow:hidden;-webkit-font-smoothing:antialiased;}
.frame{width:1080px;height:1920px;position:relative;overflow:hidden;
  background:radial-gradient(110% 70% at 50% 10%, var(--ink-deep) 0%, var(--ink-deep-2) 60%, #05070a 100%);
  font-family:var(--sans);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:110px 96px;}
.avatar{width:440px;height:440px;border-radius:50%;overflow:hidden;border:7px solid rgba(255,255,255,.10);
  box-shadow:0 36px 80px rgba(0,0,0,.55);background:var(--ink-deep);flex:0 0 auto;}
.avatar img{width:100%;height:100%;object-fit:cover;object-position:50% 30%;display:block;}
.stars{font-size:58px;letter-spacing:12px;color:#FFC24B;line-height:1;margin:80px 0 52px;}
.quote{font-family:var(--serif);color:#fff;font-size:108px;line-height:1.05;letter-spacing:-1px;text-align:center;max-width:900px;}
.quote em{color:var(--accent-soft);font-style:normal;}
.name{margin-top:80px;font-weight:800;font-size:50px;color:#fff;}
.role{margin-top:10px;font-weight:600;font-size:35px;color:#9aa3b5;text-align:center;}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--accent-soft);vertical-align:middle;margin:0 16px 5px;}
</style>
</head>
<body>
<div class="frame">
  <div class="avatar"><img src="assets/placeholder-avatar.svg" alt="Customer photo"></div>
  <div class="stars">★★★★★</div>
  <div class="quote">Best decision <em>I made all year.</em></div>
  <div class="name">Customer name</div>
  <div class="role">What they do <span class="dot"></span> Where they're from</div>
</div>
</body>
</html>
