<!doctype html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="tokens.css">
<style>
  .frame{width:1080px;height:1350px;background:#fff;
    font-family:"Roboto",-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif;color:#0f0f0f;padding:54px 54px 0;}
  /* video card */
  .thumb{position:relative;width:100%;height:548px;border-radius:20px;overflow:hidden;
    background:linear-gradient(150deg,#e9d9c6,#d9c3a8 55%,#c9a986);}
  .dur{position:absolute;right:20px;bottom:20px;background:rgba(0,0,0,.82);color:#fff;font-size:26px;font-weight:600;
    padding:6px 12px;border-radius:8px;letter-spacing:.3px;}
  .title{font-size:38px;font-weight:700;line-height:1.28;margin:24px 4px 14px;letter-spacing:-.2px;}
  .vmeta{display:flex;align-items:center;gap:18px;margin:0 4px 6px;}
  .chan{width:56px;height:56px;border-radius:50%;background:linear-gradient(#8a8a8a,#6f6f6f);flex:0 0 56px;}
  .redact{height:26px;border-radius:13px;background:#dcdcdc;}
  /* comments */
  .chead{display:flex;align-items:center;gap:20px;font-size:31px;font-weight:700;margin:40px 4px 30px;}
  .chead svg{opacity:.85;}
  .cm{display:flex;gap:24px;margin:0 4px 40px;}
  .ca{width:70px;height:70px;border-radius:50%;flex:0 0 70px;display:flex;align-items:center;justify-content:center;
    color:#fff;font-size:32px;font-weight:600;}
  .cbody{flex:1;min-width:0;}
  .cline{display:flex;align-items:center;gap:16px;margin-bottom:12px;}
  .cname{width:220px;height:24px;border-radius:12px;background:#d9d9d9;}
  .ctime{font-size:25px;color:#606060;}
  .ctext{font-size:33px;line-height:1.34;color:#0f0f0f;margin-bottom:16px;}
  .crow{display:flex;align-items:center;gap:34px;color:#606060;}
  .crow .ico{display:flex;align-items:center;gap:12px;}
  .crow .reply{font-size:27px;font-weight:700;color:#0f0f0f;}
  .heart{position:relative;width:34px;height:34px;}
  .heart .hb{position:absolute;right:-8px;bottom:-8px;width:26px;height:26px;border-radius:50%;overflow:hidden;}
  .heart .hb img{width:100%;height:100%;object-fit:cover;object-position:50% 26%;display:block;}
</style></head>
<body><div class="frame">
  <div class="thumb">
    <!-- flat laptop-on-desk illustration -->
    <svg width="100%" height="100%" viewBox="0 0 600 300" preserveAspectRatio="xMidYMid slice">
      <rect x="0" y="196" width="600" height="104" fill="#b98f63"/>
      <ellipse cx="300" cy="270" rx="180" ry="16" fill="#00000018"/>
      <!-- laptop -->
      <rect x="214" y="96" width="172" height="112" rx="8" fill="#2f3440"/>
      <rect x="226" y="108" width="148" height="88" rx="4" fill="#454b59"/>
      <rect x="236" y="120" width="88" height="10" rx="5" fill="#7b8496"/>
      <rect x="236" y="140" width="118" height="8" rx="4" fill="#626b7d"/>
      <rect x="236" y="156" width="70" height="8" rx="4" fill="#626b7d"/>
      <path d="M196 208h208l16 20H180z" fill="#c8cdd6"/>
      <rect x="180" y="226" width="240" height="8" rx="4" fill="#aeb4bf"/>
      <!-- coffee -->
      <ellipse cx="454" cy="204" rx="30" ry="10" fill="#e7ddce"/>
      <path d="M426 200a28 10 0 0 0 56 0z" fill="#fff"/>
      <rect x="440" y="176" width="28" height="26" rx="4" fill="#fff"/>
      <path d="M468 182h8a7 7 0 0 1 0 14h-8" fill="none" stroke="#fff" stroke-width="4"/>
      <!-- plant -->
      <rect x="120" y="182" width="40" height="26" rx="5" fill="#c86b4a"/>
      <path d="M140 182c-10-20 4-34 4-34M140 182c8-16-2-30-2-30M140 182c14-14 24-10 24-10" stroke="#4f7d54" stroke-width="6" fill="none" stroke-linecap="round"/>
    </svg>
    <div class="dur">12:41</div>
  </div>
  <div class="title">How my marketing runs itself</div>
  <div class="vmeta"><div class="chan"></div><div style="flex:1"><div class="redact" style="width:300px;margin-bottom:12px"></div><div class="redact" style="width:200px;height:22px"></div></div></div>

  <div class="chead">
    <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#0f0f0f" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
    Comments
  </div>

  <div class="cm">
    <div class="ca" style="background:#c2410c">A</div>
    <div class="cbody">
      <div class="cline"><span class="cname"></span><span class="ctime">2 days ago</span></div>
      <div class="ctext">wait. it drafts the newsletter before you wake up?</div>
      <div class="crow">
        <span class="ico"><span class="heart"><svg width="34" height="34" viewBox="0 0 24 24" fill="#e0245e"><path d="M12 20s-7-4.4-7-9.3A3.7 3.7 0 0 1 12 8a3.7 3.7 0 0 1 7 2.7C19 15.6 12 20 12 20z"/></svg><span class="hb"><img src="assets/placeholder-avatar.svg" alt=""></span></span></span>
        <span class="ico"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#606060" stroke-width="2"><path d="M4 10h3v10H4zM20 11a2 2 0 0 0-2-2h-5l.9-4.2A1.6 1.6 0 0 0 11 4L7 9v11h9a2 2 0 0 0 2-1.5z"/></svg></span>
        <span class="ico"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#606060" stroke-width="2"><path d="M20 14h-3V4h3zM4 13a2 2 0 0 0 2 2h5l-.9 4.2A1.6 1.6 0 0 0 13 20l4-5V4H8a2 2 0 0 0-2 1.5z"/></svg></span>
        <span class="reply">Reply</span>
      </div>
    </div>
  </div>

  <div class="cm">
    <div class="ca" style="background:#0e7490">M</div>
    <div class="cbody">
      <div class="cline"><span class="cname"></span><span class="ctime">1 day ago</span></div>
      <div class="ctext">is this thing real or hype?</div>
      <div class="crow">
        <span class="ico"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#606060" stroke-width="2"><path d="M4 10h3v10H4zM20 11a2 2 0 0 0-2-2h-5l.9-4.2A1.6 1.6 0 0 0 11 4L7 9v11h9a2 2 0 0 0 2-1.5z"/></svg></span>
        <span class="ico"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#606060" stroke-width="2"><path d="M20 14h-3V4h3zM4 13a2 2 0 0 0 2 2h5l-.9 4.2A1.6 1.6 0 0 0 13 20l4-5V4H8a2 2 0 0 0-2 1.5z"/></svg></span>
        <span class="reply">Reply</span>
      </div>
    </div>
  </div>
</div></body></html>
