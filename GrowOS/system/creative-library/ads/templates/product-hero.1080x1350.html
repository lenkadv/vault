<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="tokens.css">
<style>
.frame{width:1080px;height:1350px;
  background:linear-gradient(150deg,var(--accent) 0%,var(--accent-soft) 34%,var(--ink-deep) 74%,var(--ink-deep-2) 100%);
  font-family:var(--sans);
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:90px;}
.frame::after{content:"";position:absolute;inset:0;background:radial-gradient(80% 60% at 50% 42%, rgba(255,255,255,.12), transparent 70%);}
.headline{position:relative;z-index:2;font-family:var(--serif);
  font-size:66px;line-height:1.06;color:#fff;text-align:center;margin-bottom:74px;
  letter-spacing:-.5px;text-shadow:0 6px 30px rgba(10,10,15,.22);max-width:820px;}
.card{position:relative;z-index:2;width:760px;background:#fff;border-radius:34px;
  transform:rotate(3deg);padding:52px 52px 56px;
  box-shadow:0 50px 90px rgba(10,10,15,.34), 0 14px 30px rgba(10,10,15,.22);}
.chead{display:flex;align-items:center;gap:16px;margin-bottom:36px;}
.chead h2{font-size:33px;font-weight:800;color:#1b2422;letter-spacing:-.3px;}
.count{width:46px;height:46px;border-radius:14px;background:var(--ink-deep);color:#fff;
  font-size:26px;font-weight:800;display:flex;align-items:center;justify-content:center;}
.qrow{display:flex;align-items:center;gap:22px;padding:28px 4px;border-top:2px solid #f0ece3;}
.qrow:first-of-type{border-top:none;}
.dot{width:44px;height:44px;flex:none;border-radius:12px;background:#F5EFE6;display:flex;align-items:center;justify-content:center;}
.dot svg{width:26px;height:26px;stroke:var(--accent);stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round;}
.qtitle{flex:1;font-size:32px;font-weight:600;color:#26332f;letter-spacing:-.2px;}
.ready{display:inline-flex;align-items:center;gap:9px;background:#e7f4ec;color:#0f8a4d;
  font-size:22px;font-weight:700;padding:11px 20px;border-radius:30px;}
.ready i{width:12px;height:12px;border-radius:50%;background:#17a95c;display:block;}
</style>
</head>
<body>
<div class="frame">
  <div class="headline">Your marketing,<br>waiting for a yes.</div>
  <div class="card">
    <div class="chead"><div class="count">4</div><h2>Waiting for your OK</h2></div>
    <div class="qrow"><div class="dot"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg></div><div class="qtitle">Thursday newsletter</div><div class="ready"><i></i>ready</div></div>
    <div class="qrow"><div class="dot"><svg viewBox="0 0 24 24"><path d="M4 11v2a1 1 0 001 1h3l5 4V6L8 10H5a1 1 0 00-1 1z"/><path d="M18 8a6 6 0 010 8"/></svg></div><div class="qtitle">2 ad variants</div><div class="ready"><i></i>ready</div></div>
    <div class="qrow"><div class="dot"><svg viewBox="0 0 24 24"><path d="M4 4h16v12H8l-4 4z"/></svg></div><div class="qtitle">LinkedIn post: pricing story</div><div class="ready"><i></i>ready</div></div>
    <div class="qrow"><div class="dot"><svg viewBox="0 0 24 24"><path d="M21 11.5a8.4 8.4 0 01-9 8.4L4 21l1.1-4A8.4 8.4 0 1121 11.5z"/></svg></div><div class="qtitle">Customer email reply</div><div class="ready"><i></i>ready</div></div>
  </div>
</div>
</body>
</html>
