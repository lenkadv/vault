<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="tokens.css">
<style>
.frame{width:1080px;height:1350px;
  background:radial-gradient(120% 90% at 50% 8%, var(--ink-deep) 0%, var(--ink-deep-2) 62%, #05070a 100%);
  font-family:var(--sans);display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:96px 96px 88px;}

/* Centered face, fully shown circle. Square source photo -> 380px circle is safe (medium crop). */
.avatar{width:380px;height:380px;border-radius:50%;overflow:hidden;
  border:6px solid rgba(255,255,255,.10);
  box-shadow:0 30px 70px rgba(0,0,0,.55);background:var(--ink-deep);flex:0 0 auto;}
.avatar img{width:100%;height:100%;object-fit:cover;object-position:50% 30%;display:block;}

.stars{font-size:50px;letter-spacing:10px;color:#FFC24B;line-height:1;margin:60px 0 40px;}

.quote{font-family:var(--serif);color:#fff;font-size:92px;line-height:1.04;
  letter-spacing:-1px;text-align:center;max-width:880px;}
.quote em{color:var(--accent-soft);font-style:normal;}

.name{margin-top:56px;font-weight:800;font-size:42px;color:#fff;letter-spacing:.2px;}
.role{margin-top:8px;font-weight:600;font-size:30px;color:#9aa3b5;text-align:center;}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent-soft);
  vertical-align:middle;margin:0 14px 4px;}
</style>
</head>
<body>
<div class="frame">
  <div class="avatar"><img src="assets/placeholder-avatar.svg" alt="Customer photo"></div>
  <div class="stars">★★★★★</div>
  <div class="quote">Best decision <em>I made all year.</em></div>
  <div class="name">Customer name</div>
  <div class="role">What they do <span class="dot"></span> Where they're from</div>
</div>
</body>
</html>
