<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="tokens.css">
<style>
  .frame.social{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--sans);
  }

  /* subtle premium texture: two soft accent glows, nothing loud */
  .frame.social::before{
    content:"";
    position:absolute;
    top:-260px; right:-220px;
    width:720px; height:720px;
    background:radial-gradient(circle at center, rgba(52,84,209,.14), rgba(52,84,209,0) 62%);
    pointer-events:none;
  }
  .frame.social::after{
    content:"";
    position:absolute;
    bottom:-300px; left:-260px;
    width:760px; height:760px;
    background:radial-gradient(circle at center, rgba(27,35,51,.12), rgba(27,35,51,0) 64%);
    pointer-events:none;
  }

  .stage{
    position:absolute;
    inset:0;
    padding:128px 88px;
    display:flex;
    flex-direction:column;
    justify-content:center;
  }

  /* eyebrow / kicker */
  .kicker{
    font-family:var(--sans);
    font-weight:700;
    font-size:26px;
    letter-spacing:.42em;
    text-transform:uppercase;
    color:var(--ink-deep);
    margin-bottom:44px;
  }

  /* the hero number */
  .stat{
    position:relative;
    font-family:var(--serif);
    font-weight:400;
    font-size:240px;
    line-height:.86;
    letter-spacing:-.02em;
    white-space:nowrap;
    color:var(--ink);
  }
  .stat .plus{ color:var(--accent); }

  /* accent rule under the number */
  .rule{
    width:200px;
    height:12px;
    border-radius:6px;
    background:var(--accent);
    margin:56px 0 40px;
  }

  .label{
    font-family:var(--serif);
    font-weight:400;
    font-size:96px;
    line-height:1.02;
    color:var(--ink-deep-2);
    max-width:820px;
  }

  .context{
    font-family:var(--sans);
    font-weight:500;
    font-size:34px;
    line-height:1.45;
    color:var(--muted);
    max-width:720px;
    margin-top:32px;
  }
</style>
</head>
<body>
  <div class="frame social">
    <div class="stage">
      <div class="kicker">The receipts</div>
      <div class="stat">10,000<span class="plus">+</span></div>
      <div class="rule"></div>
      <div class="label">[what the number is]</div>
      <div class="context">[One real sentence of context: where it's from, why it's true, why it matters.]</div>
    </div>
  </div>
</body>
</html>
