<!doctype html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="tokens.css">
<style>
  .frame{width:1080px;height:1350px;
    font-family:-apple-system,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
    background:radial-gradient(130% 100% at 22% 12%,var(--paper) 0%,var(--paper-2) 34%,var(--accent-soft) 62%,var(--accent) 100%);}
  .frame::before{content:"";position:absolute;inset:-60px;
    background:radial-gradient(55% 45% at 78% 82%,rgba(52,84,209,.22),transparent 70%);}
  .win{position:absolute;top:150px;left:80px;width:920px;height:1010px;background:#fff;
    border-radius:15px;overflow:hidden;box-shadow:0 44px 96px rgba(20,20,25,.36),0 10px 26px rgba(0,0,0,.18);}
  .bar{height:98px;background:linear-gradient(#f7f7f7,#ececec);border-bottom:1px solid #d6d6d6;
    display:flex;align-items:center;padding:0 28px;position:relative;}
  .lights{display:flex;gap:17px;}
  .lights i{width:27px;height:27px;border-radius:50%;display:block;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.14);}
  .r{background:#ff5f57;}.y{background:#febc2e;}.g{background:#28c840;}
  .nav{display:flex;gap:30px;margin-left:44px;}
  .title{position:absolute;left:0;right:0;text-align:center;font-size:31px;font-weight:600;color:#3a3a3a;
    display:flex;align-items:center;justify-content:center;gap:13px;pointer-events:none;}
  .tools{margin-left:auto;display:flex;gap:26px;align-items:center;}
  .body{display:flex;height:912px;}
  .side{width:252px;background:#f1eff3;border-right:1px solid #e0dee4;padding:28px 16px;}
  .sglab{font-size:20px;color:#9c9ca4;font-weight:700;margin:0 12px 14px;}
  .sitem{display:flex;align-items:center;gap:15px;padding:10px 12px;border-radius:9px;font-size:25px;color:#3d3d42;}
  .sitem.on{background:#dad9e0;}
  .sdot{width:26px;height:26px;border-radius:7px;display:inline-block;}
  .main{flex:1;background:#fff;position:relative;}
  .colhead{font-size:21px;color:#9c9ca4;border-bottom:1px solid #ededed;padding:15px 32px;font-weight:700;}
  .row{display:flex;align-items:center;gap:22px;padding:19px 32px;font-size:31px;color:#2b2b2e;border-bottom:1px solid #f5f5f5;}
  .row.sel{background:#eaf2ff;}
  .row.brainrow .nm{font-weight:800;}
  .hand{position:absolute;font-family:"Bradley Hand","Marker Felt","Noteworthy","Chalkboard SE",cursive;
    color:var(--accent);font-size:50px;font-weight:700;line-height:1.05;transform:rotate(-6deg);text-align:center;}
  svg.arrow{position:absolute;overflow:visible;}
</style></head>
<body><div class="frame">
  <svg width="0" height="0" style="position:absolute"><defs>
    <linearGradient id="fold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9AD1FB"/><stop offset="1" stop-color="#4C9EEB"/>
    </linearGradient>
    <symbol id="folder" viewBox="0 0 52 42">
      <path d="M4 6h13l5 5h22a4 4 0 0 1 4 4v3H2v-9a4 4 0 0 1 4-3z" fill="#3D8FE0"/>
      <path d="M2 13h48a3 3 0 0 1 3 3v20a4 4 0 0 1-4 4H3a3 3 0 0 1-3-3V16a3 3 0 0 1 2-3z" fill="url(#fold)"/>
    </symbol>
  </defs></svg>

  <div class="win">
    <div class="bar">
      <div class="lights"><i class="r"></i><i class="y"></i><i class="g"></i></div>
      <div class="nav">
        <svg width="17" height="30" viewBox="0 0 17 30" fill="none" stroke="#bcbcbc" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M13 4 5 15l8 11"/></svg>
        <svg width="17" height="30" viewBox="0 0 17 30" fill="none" stroke="#d8d8d8" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4l8 11-8 11"/></svg>
      </div>
      <div class="title">
        <svg width="32" height="26" viewBox="0 0 52 42"><use href="#folder"/></svg>Our Marketing
      </div>
      <div class="tools">
        <svg width="36" height="30" viewBox="0 0 36 30" fill="#a0a0a0"><rect x="0" y="4" width="15" height="9" rx="2"/><rect x="0" y="17" width="15" height="9" rx="2"/><rect x="21" y="4" width="15" height="9" rx="2"/><rect x="21" y="17" width="15" height="9" rx="2"/></svg>
        <svg width="30" height="30" viewBox="0 0 30 30" fill="none" stroke="#a0a0a0" stroke-width="3.2"><circle cx="12" cy="12" r="9"/><path d="M19 19l8 8" stroke-linecap="round"/></svg>
      </div>
    </div>
    <div class="body">
      <div class="side">
        <div class="sglab">Favorites</div>
        <div class="sitem"><span class="sdot" style="background:#3aa1ff"></span>AirDrop</div>
        <div class="sitem"><span class="sdot" style="background:#8e8e93"></span>Recents</div>
        <div class="sitem"><span class="sdot" style="background:#5b7cff"></span>Applications</div>
        <div class="sitem"><span class="sdot" style="background:#34c759"></span>Desktop</div>
        <div class="sitem on"><span class="sdot" style="background:#ffb23e"></span>Our Marketing</div>
        <div class="sitem"><span class="sdot" style="background:#a2845e"></span>Downloads</div>
        <div class="sglab" style="margin-top:28px">iCloud</div>
        <div class="sitem"><span class="sdot" style="background:#5ac8fa"></span>iCloud Drive</div>
      </div>
      <div class="main">
        <div class="colhead">Name</div>
        <div class="row"><svg width="46" height="37" viewBox="0 0 52 42"><use href="#folder"/></svg><span class="nm">newsletters</span></div>
        <div class="row"><svg width="46" height="37" viewBox="0 0 52 42"><use href="#folder"/></svg><span class="nm">ads</span></div>
        <div class="row"><svg width="46" height="37" viewBox="0 0 52 42"><use href="#folder"/></svg><span class="nm">social</span></div>
        <div class="row"><svg width="46" height="37" viewBox="0 0 52 42"><use href="#folder"/></svg><span class="nm">customer-replies</span></div>
        <div class="row brainrow sel"><svg width="46" height="37" viewBox="0 0 52 42"><use href="#folder"/></svg><span class="nm">playbook</span></div>
      </div>
    </div>
  </div>

  <div class="hand" style="left:440px;top:760px;width:500px;font-size:76px;">it knows<br>the business</div>
  <svg class="arrow" style="left:410px;top:600px;width:230px;height:170px" viewBox="0 0 230 170">
    <path d="M195 155 C 172 125, 130 105, 76 88" fill="none" style="stroke:var(--accent)" stroke-width="12" stroke-linecap="round"/>
    <path d="M76 88 l 46 0 M76 88 l 24 36" fill="none" style="stroke:var(--accent)" stroke-width="12" stroke-linecap="round"/>
  </svg>
</div></body></html>
