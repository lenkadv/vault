<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=1080,initial-scale=1">
<link rel="stylesheet" href="tokens.css">
<style>
  html,body{width:1080px;height:1350px;overflow:hidden}
  body{font-family:-apple-system,"SF Pro Text","SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;color:#fff}
  .frame{width:1080px;height:1350px;overflow:hidden;position:relative;display:flex;flex-direction:column;
    background:
      radial-gradient(120% 85% at 80% 6%, rgba(52,84,209,.45) 0%, rgba(52,84,209,0) 52%),
      radial-gradient(130% 95% at 10% 96%, rgba(20,30,60,.6) 0%, rgba(20,30,60,0) 55%),
      linear-gradient(168deg,#1B2333 0%, #12161F 46%, #080a10 100%);}

  /* ---- top: right-side status icons + lock ---- */
  .topbar{flex:0 0 76px;display:flex;align-items:center;justify-content:flex-end;padding:0 52px;gap:14px}
  .topbar svg{display:block}
  .lockrow{text-align:center;padding-top:8px}

  /* ---- clock ---- */
  .clockwrap{text-align:center;padding:10px 0 26px}
  .date{font-size:38px;font-weight:600;color:rgba(255,255,255,.86);letter-spacing:.4px}
  .time{font-size:200px;font-weight:250;line-height:1.04;letter-spacing:-4px;color:#fff;font-feature-settings:"tnum"}

  /* ---- summary ---- */
  .notes{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:flex-end;padding:0 36px 44px}
  .sumhead{display:flex;align-items:center;gap:18px;padding:0 14px 22px}
  .sumhead .glyph{display:flex}
  .sumhead .txt{font-size:38px;font-weight:650;color:#fff;letter-spacing:.1px}
  .card{background:rgba(84,96,108,.44);-webkit-backdrop-filter:blur(40px);backdrop-filter:blur(40px);border:1px solid rgba(255,255,255,.10);border-radius:40px;padding:28px 32px;display:flex;gap:26px;align-items:center;box-shadow:0 12px 40px rgba(0,0,0,.26)}
  .card + .card{margin-top:20px}
  .appicon{flex:0 0 92px;width:92px;height:92px;border-radius:22px;background:linear-gradient(150deg,var(--accent-soft),var(--accent));display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.24)}
  .nbody{flex:1;min-width:0}
  .napp{font-size:28px;font-weight:600;color:rgba(255,255,255,.62);letter-spacing:1px;text-transform:uppercase}
  .nmsg{font-size:37px;font-weight:590;color:#fff;margin-top:6px;line-height:1.28;letter-spacing:-.2px}

  /* ---- bottom pills + home bar ---- */
  .footer{flex:0 0 auto;display:flex;justify-content:space-between;padding:0 70px 8px}
  .pill{width:104px;height:104px;border-radius:50%;background:rgba(84,96,108,.40);-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);display:flex;align-items:center;justify-content:center}
  .homebar{flex:0 0 46px;display:flex;align-items:center;justify-content:center}
  .homebar span{width:300px;height:11px;border-radius:6px;background:#fff;opacity:.92}
</style></head>
<body><div class="frame">

  <!-- top status icons -->
  <div class="topbar">
    <svg width="40" height="26" viewBox="0 0 40 26" fill="#fff"><rect x="0" y="16" width="6" height="9" rx="1.5"/><rect x="9" y="11" width="6" height="14" rx="1.5"/><rect x="18" y="6" width="6" height="19" rx="1.5"/><rect x="27" y="1" width="6" height="24" rx="1.5"/></svg>
    <svg width="36" height="26" viewBox="0 0 36 26" fill="#fff"><path d="M18 5c5.5 0 10.6 2.1 14.4 5.6l-3 3.2C26.5 11.1 22.4 9.4 18 9.4S9.5 11.1 6.6 13.8l-3-3.2C7.4 7.1 12.5 5 18 5z"/><path d="M18 13.4c3 0 5.8 1.1 8 3l-3 3.2c-1.4-1.3-3.2-2-5-2s-3.6.7-5 2l-3-3.2c2.2-1.9 5-3 8-3z"/><circle cx="18" cy="23" r="3.2"/></svg>
    <svg width="54" height="26" viewBox="0 0 54 26" fill="none"><rect x="1" y="2" width="44" height="22" rx="6" stroke="#fff" stroke-opacity=".5" stroke-width="2"/><rect x="4" y="5" width="38" height="16" rx="3.5" fill="#fff"/><rect x="48" y="9" width="4" height="8" rx="2" fill="#fff" fill-opacity=".5"/></svg>
  </div>

  <!-- lock icon -->
  <div class="lockrow">
    <svg width="34" height="44" viewBox="0 0 24 30" fill="rgba(255,255,255,.85)"><path d="M12 1a7 7 0 00-7 7v3H4a2 2 0 00-2 2v13a2 2 0 002 2h16a2 2 0 002-2V13a2 2 0 00-2-2h-1V8a7 7 0 00-7-7zm-4 7a4 4 0 118 0v3H8V8z"/></svg>
  </div>

  <!-- clock -->
  <div class="clockwrap">
    <div class="date">Tuesday, July 14</div>
    <div class="time">8:40</div>
  </div>

  <!-- scheduled summary -->
  <div class="notes">
    <div class="sumhead">
      <span class="glyph">
        <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.9)" stroke-width="1.8" stroke-linejoin="round"><rect x="6" y="3" width="14" height="14" rx="3.5"/><path d="M4 8v9.5A3.5 3.5 0 007.5 21H17" stroke-linecap="round"/></svg>
      </span>
      <span class="txt">While you were with customers</span>
    </div>

    <div class="card">
      <span class="appicon">
        <svg width="50" height="42" viewBox="0 0 26 22" fill="#fff"><path d="M2 4.5A2.5 2.5 0 014.5 2h5l2.4 3H21.5A2.5 2.5 0 0124 7.5v10a2.5 2.5 0 01-2.5 2.5h-17A2.5 2.5 0 012 17.5v-13z"/></svg>
      </span>
      <span class="nbody">
        <div class="napp">Marketing</div>
        <div class="nmsg">Newsletter drafted &#183; waiting for review</div>
      </span>
    </div>

    <div class="card">
      <span class="appicon">
        <svg width="50" height="42" viewBox="0 0 26 22" fill="#fff"><path d="M2 4.5A2.5 2.5 0 014.5 2h5l2.4 3H21.5A2.5 2.5 0 0124 7.5v10a2.5 2.5 0 01-2.5 2.5h-17A2.5 2.5 0 012 17.5v-13z"/></svg>
      </span>
      <span class="nbody">
        <div class="napp">Marketing</div>
        <div class="nmsg">2 ad variants ready</div>
      </span>
    </div>

    <div class="card">
      <span class="appicon">
        <svg width="50" height="42" viewBox="0 0 26 22" fill="#fff"><path d="M2 4.5A2.5 2.5 0 014.5 2h5l2.4 3H21.5A2.5 2.5 0 0124 7.5v10a2.5 2.5 0 01-2.5 2.5h-17A2.5 2.5 0 012 17.5v-13z"/></svg>
      </span>
      <span class="nbody">
        <div class="napp">Marketing</div>
        <div class="nmsg">Customer reply drafted</div>
      </span>
    </div>
  </div>

  <!-- flashlight / camera -->
  <div class="footer">
    <span class="pill"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 2h6l-1 6h-4L9 2zM10 8h4v3l-1 11h-2l-1-11V8z"/></svg></span>
    <span class="pill"><svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M4 8a2 2 0 012-2h1.5l1.2-2h6.6l1.2 2H20a2 2 0 012 2v10a2 2 0 01-2 2H4a2 2 0 01-2-2V8z"/><circle cx="12" cy="13" r="4"/></svg></span>
  </div>
  <div class="homebar"><span></span></div>

</div></body></html>
