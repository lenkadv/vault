:root{--paper:#F1ECE6;--paper2:#E8DFD5;--ink:#231A1D;--muted:#5E5155;--acc:#9B224F;--acc2:#74183B;--pink:#F3D3E0;--red:#C8323C}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden}
body{background:var(--paper);color:var(--ink);font-family:'DM Sans',sans-serif;-webkit-font-smoothing:antialiased;position:relative}
.ar{font-family:Archivo,sans-serif;font-stretch:88%;font-weight:800;letter-spacing:-.01em}
.hand{font-family:Caveat,cursive;font-weight:700}
.top{position:absolute;left:80px;right:80px;top:90px}
.kick{font-size:26px;letter-spacing:.14em;font-weight:700;color:var(--acc)}
h1{font-size:100px;line-height:1.0;margin-top:20px}
.disk{position:absolute;left:80px;right:80px;background:#fff;border:2px solid var(--paper2);border-radius:28px;padding:40px 44px}
.d1{top:470px}.d2{top:800px}
.row{display:flex;justify-content:space-between;align-items:baseline}
.lab{font-size:30px;font-weight:700}
.when{font-size:52px;color:var(--muted)}
.bar{height:64px;border-radius:14px;background:var(--paper2);margin-top:26px;overflow:hidden}
.fill{height:100%;border-radius:14px}
.d1 .fill{width:96%;background:var(--red)}
.d2 .fill{width:38%;background:#4E8B5F}
.sub{font-size:28px;color:var(--muted);margin-top:18px}
.d1 .sub{color:var(--red);font-weight:700}
.brand{position:absolute;left:80px;bottom:70px;font-size:26px;color:var(--muted)}
.brand b{font-family:Archivo;font-stretch:88%;font-weight:800;color:var(--acc);font-size:30px;margin-right:12px}
</style></head><body>

<div class="disk d1"><div class="row"><span class="lab">Místní disk C:</span><span class="when hand">ráno</span></div>
<div class="bar"><div class="fill"></div></div><div class="sub">Na disku dochází místo</div></div>
<div class="disk d2"><div class="row"><span class="lab">Místní disk C:</span><span class="when hand">večer</span></div>
