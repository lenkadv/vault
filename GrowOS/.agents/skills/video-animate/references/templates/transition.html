<!doctype html>
<html
  lang="en"
  data-resolution="landscape"
  data-composition-variables='[
    {"id":"accent","type":"color","label":"Accent","default":"#3B82F6"},
    {"id":"font","type":"string","label":"Font family","default":"system-ui"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Transition - Split Planes Wipe</title>
    <script src="assets/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0b0f14;
      }

      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        font-family: var(--font), -apple-system, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
      }

      /* Full-bleed background lives on a child div, never on #root. This
         is what the panels reveal once they clear the frame. */
      .bg-fill {
        position: absolute;
        inset: 0;
        background: #0b0f14;
      }

      .clip {
        position: absolute;
        top: 0;
        width: 960px;
        height: 1080px;
        background: var(--accent);
        will-change: transform;
      }

      #panel-left {
        left: 0;
      }
      #panel-right {
        left: 960px;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="transition"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="1"
    >
      <div class="bg-fill"></div>

      <div
        id="panel-left"
        class="clip"
        data-start="0"
        data-duration="1"
        data-track-index="0"
      ></div>

      <div
        id="panel-right"
        class="clip"
        data-start="0"
        data-duration="1"
        data-track-index="1"
      ></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Two solid panels meet at center at t=0 (a fully covered frame),
      // then slide fully off-screen by their own width - transform only,
      // never left/width - revealing the base background by t=1. Render
      // this as its own short standalone clip; references/compositing.md
      // route (a) splices it between two shots with ffmpeg concat.
      tl.to(
        "#panel-left",
        { x: -960, duration: 1, ease: "power3.inOut" },
        0,
      );
      tl.to(
        "#panel-right",
        { x: 960, duration: 1, ease: "power3.inOut" },
        0,
      );

      window.__timelines["transition"] = tl;
    </script>
  </body>
</html>
