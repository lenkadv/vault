<!doctype html>
<html
  lang="en"
  data-resolution="portrait"
  data-composition-variables='[
    {"id":"accent","type":"color","label":"Accent","default":"#3B82F6"},
    {"id":"font","type":"string","label":"Font family","default":"system-ui"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Text Overlay - Keyword Pop + Lower Third</title>
    <script src="assets/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: transparent;
      }

      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: transparent;
        font-family: var(--font), -apple-system, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
      }

      .clip {
        position: absolute;
      }

      /* Lower third: name + role card, anchored bottom-left, clear of the
         bottom ~15% safe zone (references/craft.md). */
      #lower-third {
        left: 64px;
        right: 64px;
        bottom: 220px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 30px 38px;
        background: rgba(10, 12, 16, 0.55);
        border-left: 7px solid var(--accent);
        border-radius: 14px;
      }
      #lower-third .name {
        font-weight: 800;
        font-size: 46px;
        color: #ffffff;
        letter-spacing: 0.01em;
        line-height: 1.1;
      }
      #lower-third .role {
        font-weight: 500;
        font-size: 29px;
        color: rgba(255, 255, 255, 0.78);
        line-height: 1.2;
      }

      /* Keyword pop: big bold word, centered */
      #keyword-1 {
        left: 0;
        width: 1080px;
        top: 610px;
        text-align: center;
        font-weight: 900;
        font-size: 132px;
        color: #ffffff;
        text-transform: uppercase;
        letter-spacing: 0.01em;
        text-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
        transform-origin: 50% 50%;
        will-change: transform;
      }

      /* Accent stat pill */
      #keyword-2 {
        left: 0;
        width: 1080px;
        top: 900px;
        display: flex;
        justify-content: center;
        transform-origin: 50% 50%;
        will-change: transform;
      }
      #keyword-2 .pill {
        padding: 20px 40px;
        background: var(--accent);
        border-radius: 999px;
        font-weight: 800;
        font-size: 42px;
        color: #0b0f14;
        letter-spacing: 0.01em;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="textoverlay"
      data-start="0"
      data-width="1080"
      data-height="1920"
      data-duration="6"
    >
      <div
        id="lower-third"
        class="clip"
        data-start="0.4"
        data-duration="5.0"
        data-track-index="1"
      >
        <div class="name">Full Name</div>
        <div class="role">Role, Company</div>
      </div>

      <div
        id="keyword-1"
        class="clip"
        data-start="1.0"
        data-duration="2.0"
        data-track-index="2"
      >
        Keyword
      </div>

      <div
        id="keyword-2"
        class="clip"
        data-start="3.6"
        data-duration="2.2"
        data-track-index="3"
      >
        <div class="pill">Your Stat</div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Lower third: slide + fade in from the left, hold, slide + fade out
      tl.fromTo(
        "#lower-third",
        { x: -60, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
        0.4,
      );
      tl.to(
        "#lower-third",
        { x: -40, opacity: 0, duration: 0.5, ease: "power2.in" },
        4.9,
      );

      // Keyword pop 1: spring-pop-entrance (scale 0->1, power3.out), quick exit
      tl.fromTo(
        "#keyword-1",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" },
        1.0,
      );
      tl.to(
        "#keyword-1",
        { scale: 0.85, opacity: 0, duration: 0.45, ease: "power2.in" },
        2.55,
      );

      // Accent pill: spring-pop-entrance, quick exit
      tl.fromTo(
        "#keyword-2",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" },
        3.6,
      );
      tl.to(
        "#keyword-2",
        { scale: 0.85, opacity: 0, duration: 0.45, ease: "power2.in" },
        5.35,
      );

      window.__timelines["textoverlay"] = tl;
    </script>
  </body>
</html>
